name: Build and test 26.1.2
on:
  push:
    branches: [main, atm11-0.14]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate data
        run: ./gradlew --no-daemon --max-workers=2 runData
      - name: Build and run unit tests
        run: ./gradlew --no-daemon --max-workers=2 build
      - name: Compile isolated client QA fixture
        run: ./gradlew -p qa/client --no-daemon --max-workers=2 build
      - name: Compile isolated server QA fixture
        run: ./gradlew -p qa/server --no-daemon --max-workers=2 build
      - uses: actions/upload-artifact@v4
        with:
          name: source-build-26.1.2
          path: |
            build/libs/Mekanism-*.jar
            build/libs/MekanismGenerators-*.jar
            build/reports/tests/test/
            build/test-results/test/
